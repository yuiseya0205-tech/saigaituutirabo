<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyCjmz-qD1_GyPe5xxfWwfd82P5Z0Fn7z00",
authDomain:"saigaituutirabo.firebaseapp.com",
projectId:"saigaituutirabo",
storageBucket:"saigaituutirabo.firebasestorage.app",
messagingSenderId:"367538792587",
appId:"1:367538792587:web:9a3f5b9dc4e4271cce8c8e",
measurementId:"G-EYSDLYT964"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

const map=L.map("map").setView([35.9433,136.1881],13);

L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{maxZoom:19}
).addTo(map);

let userLat=null;
let userLng=null;
let userMarker=null;
let routeLine=null;

const markers=[];

navigator.geolocation.getCurrentPosition(p=>{
userLat=p.coords.latitude;
userLng=p.coords.longitude;

userMarker=L.marker([userLat,userLng])
.addTo(map)
.bindPopup("現在地");

map.setView([userLat,userLng],15);
});

window.addShelter=async function(){

if(userLat===null)return;

await addDoc(
collection(db,"shelters"),
{
name:"避難所",
lat:userLat,
lng:userLng,
created:Date.now()
}
);

};

onSnapshot(
collection(db,"shelters"),
snap=>{

markers.forEach(m=>map.removeLayer(m));
markers.length=0;

snap.forEach(doc=>{

const s=doc.data();

const marker=L.marker(
[s.lat,s.lng]
)
.addTo(map)
.bindPopup(s.name);

markers.push(marker);

});

}
);

window.locateUser=function(){

navigator.geolocation.getCurrentPosition(pos=>{

userLat=pos.coords.latitude;
userLng=pos.coords.longitude;

if(userMarker){
map.removeLayer(userMarker);
}

userMarker=L.marker(
[userLat,userLng]
)
.addTo(map)
.bindPopup("現在地");

map.setView([userLat,userLng],15);

});

};

function distance(lat1,lng1,lat2,lng2){

const R=6371;

const dLat=(lat2-lat1)*Math.PI/180;
const dLng=(lng2-lng1)*Math.PI/180;

const a=
Math.sin(dLat/2)**2+
Math.cos(lat1*Math.PI/180)*
Math.cos(lat2*Math.PI/180)*
Math.sin(dLng/2)**2;

return R*2*Math.atan2(
Math.sqrt(a),
Math.sqrt(1-a)
);

}

window.findNearest=function(){

if(userLat===null)return;

let nearest=null;
let min=999999;

markers.forEach(m=>{

const p=m.getLatLng();

const d=distance(
userLat,
userLng,
p.lat,
p.lng
);

if(d<min){
min=d;
nearest=p;
}

});

if(!nearest)return;

if(routeLine){
map.removeLayer(routeLine);
}

routeLine=L.polyline(
[
[userLat,userLng],
[nearest.lat,nearest.lng]
],
{
color:"red",
weight:5
}
).addTo(map);

const walk=Math.round(min/5*60);

document.getElementById("info").innerHTML=
"距離:"+min.toFixed(2)+"km<br>徒歩:"+walk+"分";

};

document.getElementById("panel").insertAdjacentHTML(
"beforeend",
'<button onclick="addShelter()">避難所追加</button>'
);
</script>
